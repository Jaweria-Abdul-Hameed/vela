# Supply-chain policy (X05). Checked by `cargo deny check` in .github/workflows/security.yml.
# An exception needs a reason, and every exception is also listed with an expiry in security/audit-allowlist.json
# (scripts/check-audit-allowlist.mjs fails CI for an entry without a justification or with a past expiry).

[graph]
targets = [{ triple = "x86_64-pc-windows-msvc" }]

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "0BSD",
  "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses.private]
# Workspace crates are `publish = false`; they carry no license expression.
ignore = true
