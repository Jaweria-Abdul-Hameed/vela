[package]
name = "vela-desktop"
description = "Vela desktop composition root (Tauri shell): commands, wiring, plugins, tray, window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# The library holds all composition; src/main.rs only calls vela_desktop::run (the standard Tauri 2 layout).
[lib]
name = "vela_desktop"

[features]
global-shortcut = ["dep:tauri-plugin-global-shortcut"]
# Embeds the bundled frontend and serves it from the Tauri protocol instead of the dev server (production builds).
custom-protocol = ["tauri/custom-protocol"]
# A scripted agent for tests, never a product feature. Off by default; build.rs fails a release build that enables it.
test-agent = []

# The only crate allowed to depend on Tauri and to wire concrete adapters (rule 4).
[dependencies]
vela-domain.workspace = true
vela-persistence.workspace = true
vela-process.workspace = true
vela-git.workspace = true
vela-adapters.workspace = true
vela-core.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }
serde.workspace = true
serde_json.workspace = true
ts-rs.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tauri.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-autostart.workspace = true
tauri-plugin-updater.workspace = true
minisign-verify.workspace = true
base64.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-window-state.workspace = true
tauri-plugin-global-shortcut = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
vela-uia.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dev-dependencies]
vela-testkit.workspace = true
# A disposable updater keypair for the signature tests (minisign format); never a production key.
ed25519-dalek.workspace = true
blake2.workspace = true
tauri = { workspace = true, features = ["test"] }
