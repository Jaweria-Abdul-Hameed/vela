# Supply-chain gates (X05): secret scan of the pushed range, Rust advisory/license/ban/source checks, npm audit,
# lockfile drift, and a software bill of materials from a release-profile build.
# Third-party actions are pinned by commit SHA; tools are downloaded by exact version and verified against a pinned checksum.
# Gate configuration is data in the repository (deny.toml, security/*.json): a ticket, an issue or AGENTS.md text cannot change it.
name: Security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_DENY_VERSION: 0.20.2
  CARGO_DENY_SHA256: 975a22143262fd27476d19ee00c7af67978426e40e1dee94eed6bbade1cf87dc

jobs:
  secrets:
    name: Secret scan and allowlist
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Allowlist entries need a justification and an unexpired date
        run: node scripts/check-audit-allowlist.mjs
      - name: Scan the pushed range
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="$BASE_SHA"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            base="$BEFORE_SHA"
          else
            base="$(git rev-list --max-parents=0 "$HEAD_SHA" | tail -n 1)"
          fi
          node scripts/scan-secrets.mjs "$base..$HEAD_SHA"

  rust:
    name: Rust advisories, licenses, bans, sources, locked build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Install cargo-deny (pinned version and checksum)
        shell: bash
        run: |
          curl -sSfL -o cargo-deny.tgz "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-pc-windows-msvc.tar.gz"
          echo "${CARGO_DENY_SHA256}  cargo-deny.tgz" | sha256sum -c -
          tar -xzf cargo-deny.tgz
          mkdir -p "$HOME/bin"
          cp "cargo-deny-${CARGO_DENY_VERSION}-x86_64-pc-windows-msvc/cargo-deny.exe" "$HOME/bin/"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Lockfile drift (fails when Cargo.lock needs changes)
        run: cargo metadata --locked --format-version 1 --no-deps > NUL
      - name: Advisories, licenses, bans and sources
        run: cargo deny check

  npm:
    name: npm audit and lockfile drift
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install from the committed lockfile (fails on drift)
        run: npm ci
      - name: Audit production dependencies (high severity fails)
        run: npm audit --omit=dev --audit-level=high

  sbom:
    name: Software bill of materials (release profile)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Generate the SBOM from the locked graphs
        run: node scripts/generate-sbom.mjs target/sbom.cdx.json
      - name: Release-profile build uses the same lockfile
        run: cargo metadata --locked --format-version 1 --no-deps > NUL
      - name: Show the SBOM digest
        shell: bash
        run: sha256sum target/sbom.cdx.json
