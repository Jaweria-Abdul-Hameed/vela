# CI (F01): build, test, lint, typecheck and the crate-dependency-direction check on a clean checkout.
# Windows-first product, so everything runs on windows-latest. The same npm scripts run locally
# (see "Development commands" in README.md). Third-party actions are pinned by commit SHA.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  typescript:
    name: TypeScript (format, lint, typecheck, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install the pinned Rust toolchain (the checker tests run cargo metadata)
        run: rustup toolchain install
      - name: Install from the committed lockfile
        run: npm ci
      - name: Verify
        run: npm run verify:ts
      - name: Install the Playwright browser
        run: npx playwright install chromium
      - name: Browser tests (software GL)
        run: npm run test:e2e --workspace @vela/desktop
        env:
          CI: 'true'

  rust:
    name: Rust (format, clippy, build, test, structure)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Verify (includes the crate-dependency-direction and module-skeleton checks)
        run: npm run verify:rust
      - name: Diagnose a test binary that cannot load (temporary)
        if: failure()
        shell: bash
        run: |
          pip install pefile -q
          for exe in target/debug/deps/vela_desktop-eceeb670649ff94d.exe target/debug/deps/vela_desktop-*.exe; do
            echo "== $exe"
            python -c "import pefile,sys; pe=pefile.PE(sys.argv[1]); [print(e.dll.decode(), len(e.imports), [i.name.decode() for i in e.imports if i.name][:12] if e.dll.decode().lower().startswith(('comctl','webview','shcore','user32','dwm')) else '') for e in pe.DIRECTORY_ENTRY_IMPORT]" "$exe" || true
          done
