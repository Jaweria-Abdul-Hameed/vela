# Regenerates the visual-regression baselines (U18) on the CI platform and uploads them as an artifact. A person downloads the
# artifact, looks at every changed image, and commits the ones that are meant to change. Nothing is committed automatically.
name: Update visual baselines

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baselines:
    name: Regenerate baselines (software GL)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install from the committed lockfile
        run: npm ci
      - name: Install the Playwright browser
        run: npx playwright install chromium
      - name: Regenerate the baselines
        run: npx playwright test e2e/visual.e2e.ts --update-snapshots
        working-directory: apps/desktop
        env:
          CI: 'true'
      - name: Upload the baselines
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-baselines
          path: apps/desktop/e2e/visual.e2e.ts-snapshots/
