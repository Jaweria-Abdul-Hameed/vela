[package]
name = "vela-testkit"
description = "Vela dev-only test kit: fakes, fixture repositories, scripted agent, fault harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# `fault-injection` is what makes `fault_point!` abort when armed; the kill-and-restart harness needs it live.
# Feature unification turns it on for every build that includes this dev-only crate (it adds no call sites by itself).
vela-domain = { workspace = true, features = ["fault-injection"] }
vela-process.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "process", "io-util"] }
serde.workspace = true
serde_json.workspace = true
