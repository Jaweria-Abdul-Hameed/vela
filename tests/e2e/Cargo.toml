[package]
name = "vela-e2e-tests"
description = "End-to-end tests: the real Git and process adapters under the whole core, with a scripted or the real agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
vela-domain.workspace = true
vela-persistence.workspace = true
vela-process.workspace = true
vela-git.workspace = true
vela-adapters.workspace = true
vela-core.workspace = true
vela-testkit.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
serde_json.workspace = true

[dev-dependencies]
# The crash matrix aborts child processes at fault points; the points only fire with this feature on (dev-dependency features are
# not transitive, so this crate must enable it itself).
vela-domain = { workspace = true, features = ["fault-injection"] }
rusqlite.workspace = true
